contracts:
  - name: agentchange.airline.goal_shift
    capability: recover_after_airline_goal_change
    output_schema:
      type: object
      required: [updated_goal, recovery_action]
      properties:
        updated_goal:
          type: string
        recovery_action:
          type: string
    semantic_checks:
      - updated_goal_must_reflect_latest_user_target
    resource_budget:
      max_latency_ms: 45000
      max_llm_calls: 4
      max_tool_calls: 10
      max_retries: 2
