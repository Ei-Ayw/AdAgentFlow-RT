contracts:
  - name: tau3.telecom.support_resolution
    capability: resolve_telecom_support_case
    output_schema:
      type: object
      required: [resolution, next_action]
      properties:
        resolution:
          type: string
        next_action:
          type: string
    semantic_checks:
      - next_action_must_be_available_in_tool_environment
    resource_budget:
      max_latency_ms: 30000
      max_llm_calls: 3
      max_tool_calls: 8
      max_retries: 2
