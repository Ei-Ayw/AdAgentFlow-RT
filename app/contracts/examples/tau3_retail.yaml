contracts:
  - name: tau3.retail.order_resolution
    capability: resolve_retail_customer_request
    output_schema:
      type: object
      required: [resolution, policy_compliant]
      properties:
        resolution:
          type: string
        policy_compliant:
          type: boolean
    semantic_checks:
      - resolution_must_not_violate_refund_policy
    resource_budget:
      max_latency_ms: 30000
      max_llm_calls: 3
      max_tool_calls: 8
      max_retries: 2
