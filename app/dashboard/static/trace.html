<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trace 时间线 · AdAgentFlow</title>
    <link rel="stylesheet" href="/dashboard/trace.css">
</head>
<body>

<div class="header">
    <h1>🕒 Trace 时间线</h1>
    <p class="subtitle">输入 task_id，查看任务所有 step 的执行甘特图、token、模型、retry 记录</p>
</div>

<nav class="nav-bar">
    <a href="/dashboard/index.html">← 总览 Dashboard</a>
    <a href="/">根页</a>
</nav>

<div class="container">

    <!-- Search -->
    <section class="card">
        <h2>🔍 查询</h2>
        <div class="search-row">
            <input
                id="task-input"
                type="text"
                placeholder="输入 task_id，例如 task_1700000000_xxxxxxxx"
                spellcheck="false"
                autocomplete="off"
            >
            <button id="load-btn">加载时间线</button>
        </div>
        <div id="error-box" class="error-msg" style="display:none; margin-top:10px;"></div>
    </section>

    <!-- Task summary -->
    <section class="card" id="task-card" style="display:none;">
        <h2>📌 任务概览</h2>
        <div class="task-info" id="task-info"></div>
    </section>

    <!-- Gantt timeline -->
    <section class="card" id="gantt-card" style="display:none;">
        <h2>📊 甘特时间线</h2>
        <div class="gantt-wrapper">
            <svg id="gantt-svg" class="gantt-svg"></svg>
        </div>
        <div class="gantt-legend">
            <span><span class="dot" style="background:#22c55e;"></span>成功</span>
            <span><span class="dot" style="background:#ef4444;"></span>失败</span>
            <span><span class="dot" style="background:#3b82f6;"></span>运行中</span>
            <span><span class="dot" style="background:#f59e0b;"></span>有 retry</span>
            <span><span class="dot" style="background:#94a3b8;"></span>未开始</span>
        </div>
    </section>

    <!-- Step cards -->
    <section class="card" id="steps-card" style="display:none;">
        <h2>🧩 Step 详情</h2>
        <div class="step-list" id="step-list"></div>
    </section>

    <!-- Event table -->
    <section class="card" id="events-card" style="display:none;">
        <h2>📋 详细事件</h2>
        <table class="data-table">
            <thead>
                <tr>
                    <th>时间</th>
                    <th>事件类型</th>
                    <th>step</th>
                    <th>状态</th>
                    <th>耗时</th>
                    <th>模型</th>
                    <th>Prompt</th>
                    <th>Token</th>
                    <th>说明</th>
                </tr>
            </thead>
            <tbody id="event-tbody"></tbody>
        </table>
    </section>

    <div id="empty-tip" class="empty">输入 task_id 开始查询，支持 URL 参数 <code>?task_id=xxx</code> 自动加载。</div>

</div>

<footer class="footer">
    AdAgentFlow Trace · 接口 <code>/api/v1/traces/by-task/{task_id}/timeline</code>
</footer>

<script src="/dashboard/trace.js"></script>
</body>
</html>
