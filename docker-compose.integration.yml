services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: adagentflow
      POSTGRES_USER: adagent
      POSTGRES_PASSWORD: adagent_it_password
    ports:
      - "15432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U adagent -d adagentflow"]
      interval: 2s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    ports:
      - "16379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 20

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: adagent
      RABBITMQ_DEFAULT_PASS: adagent_it_password
      RABBITMQ_DEFAULT_VHOST: adagentflow
    ports:
      - "25672:5672"
      - "15673:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_port_connectivity"]
      interval: 3s
      timeout: 5s
      retries: 20
