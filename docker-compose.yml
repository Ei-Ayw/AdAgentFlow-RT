# AdAgentFlow 生产级 Docker 编排
# 包含: FastAPI 服务 / Worker 池 / PostgreSQL / Redis / RabbitMQ / Langfuse / Dashboard
# 可通过 docker compose up 一键拉起全部依赖

services:
  postgres:
    image: postgres:16-alpine
    container_name: adagentflow-postgres
    environment:
      POSTGRES_DB: adagentflow
      POSTGRES_USER: adagent
      POSTGRES_PASSWORD: adagent_secret_2026
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./sql/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U adagent -d adagentflow"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - adagentflow-net

  redis:
    image: redis:7-alpine
    container_name: adagentflow-redis
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "512mb", "--maxmemory-policy", "allkeys-lru"]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - adagentflow-net

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: adagentflow-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: adagent
      RABBITMQ_DEFAULT_PASS: adagent_secret_2026
      RABBITMQ_DEFAULT_VHOST: adagentflow
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 15s
      timeout: 10s
      retries: 5
    networks:
      - adagentflow-net

  langfuse:
    image: langfuse/langfuse:latest
    container_name: adagentflow-langfuse
    environment:
      DATABASE_URL: postgresql://adagent:adagent_secret_2026@postgres:5432/adagentflow?schema=langfuse
      NEXTAUTH_URL: http://localhost:3000
      NEXTAUTH_SECRET: langfuse_super_secret_change_in_prod
      SALT: langfuse_salt_change_in_prod
      HOSTNAME: 0.0.0.0
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - adagentflow-net

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: adagentflow-api
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--workers", "2"]
    env_file: .env
    environment:
      DATABASE_URL: postgresql://adagent:adagent_secret_2026@postgres:5432/adagentflow
      REDIS_URL: redis://redis:6379/0
      RABBITMQ_URL: amqp://adagent:adagent_secret_2026@rabbitmq:5672/adagentflow
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    volumes:
      - ./:/app
    networks:
      - adagentflow-net

  worker-light:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["python", "-m", "app.workers.light_worker"]
    env_file: .env
    environment:
      DATABASE_URL: postgresql://adagent:adagent_secret_2026@postgres:5432/adagentflow
      REDIS_URL: redis://redis:6379/0
      RABBITMQ_URL: amqp://adagent:adagent_secret_2026@rabbitmq:5672/adagentflow
      WORKER_TYPE: light
      WORKER_CONCURRENCY: "4"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    volumes:
      - ./:/app
    deploy:
      replicas: 3
    networks:
      - adagentflow-net

  worker-heavy:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: adagentflow-worker-heavy
    command: ["python", "-m", "app.workers.heavy_worker"]
    env_file: .env
    environment:
      DATABASE_URL: postgresql://adagent:adagent_secret_2026@postgres:5432/adagentflow
      REDIS_URL: redis://redis:6379/0
      RABBITMQ_URL: amqp://adagent:adagent_secret_2026@rabbitmq:5672/adagentflow
      WORKER_TYPE: heavy
      WORKER_CONCURRENCY: "2"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    volumes:
      - ./:/app
    networks:
      - adagentflow-net

volumes:
  postgres_data:
  redis_data:
  rabbitmq_data:

networks:
  adagentflow-net:
    driver: bridge
