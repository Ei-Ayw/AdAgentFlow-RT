apiVersion: batch/v1
kind: Job
metadata:
  name: adagentflow-migrate
  namespace: adagentflow
  labels:
    app.kubernetes.io/name: migrate
    app.kubernetes.io/part-of: adagentflow
spec:
  backoffLimit: 3
  ttlSecondsAfterFinished: 600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: migrate
        app.kubernetes.io/part-of: adagentflow
    spec:
      restartPolicy: OnFailure
      containers:
        - name: migrate
          image: adagentflow/api:latest
          imagePullPolicy: IfNotPresent
          command: ["alembic", "upgrade", "head"]
          envFrom:
            - configMapRef:
                name: adagentflow-config
          env:
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: adagentflow-secrets
                  key: db_password
            - name: DATABASE_URL
              value: "postgresql://adagent:$(DB_PASSWORD)@postgres.adagentflow.svc.cluster.local:5432/adagentflow"
