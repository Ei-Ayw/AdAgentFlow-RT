apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker-outbox
  namespace: adagentflow
  labels:
    app.kubernetes.io/name: worker-outbox
    app.kubernetes.io/part-of: adagentflow
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: worker-outbox
  template:
    metadata:
      labels:
        app.kubernetes.io/name: worker-outbox
        app.kubernetes.io/part-of: adagentflow
    spec:
      containers:
        - name: worker-outbox
          image: adagentflow/api:latest
          imagePullPolicy: IfNotPresent
          command: ["python", "-m", "app.workers.outbox_worker"]
          envFrom:
            - configMapRef:
                name: adagentflow-config
          env:
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: adagentflow-secrets
                  key: db_password
            - name: DATABASE_URL
              value: "postgresql://adagent:$(DB_PASSWORD)@postgres.adagentflow.svc.cluster.local:5432/adagentflow"
            - name: RABBITMQ_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: adagentflow-secrets
                  key: rabbitmq_password
            - name: RABBITMQ_URL
              value: "amqp://adagent:$(RABBITMQ_PASSWORD)@rabbitmq.adagentflow.svc.cluster.local:5672/adagentflow"
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
