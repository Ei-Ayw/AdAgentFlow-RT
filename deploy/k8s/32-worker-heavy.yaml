apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker-heavy
  namespace: adagentflow
  labels:
    app.kubernetes.io/name: worker-heavy
    app.kubernetes.io/part-of: adagentflow
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: worker-heavy
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: worker-heavy
        app.kubernetes.io/part-of: adagentflow
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
    spec:
      containers:
        - name: worker-heavy
          image: adagentflow/api:latest
          imagePullPolicy: IfNotPresent
          command: ["python", "-m", "app.workers.heavy_worker"]
          envFrom:
            - configMapRef:
                name: adagentflow-config
          env:
            - name: ANTHROPIC_AUTH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: adagentflow-secrets
                  key: anthropic_auth_token
            - name: LANGFUSE_PUBLIC_KEY
              valueFrom:
                secretKeyRef:
                  name: adagentflow-secrets
                  key: langfuse_public_key
            - name: LANGFUSE_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: adagentflow-secrets
                  key: langfuse_secret_key
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: adagentflow-secrets
                  key: db_password
            - name: DATABASE_URL
              value: "postgresql://adagent:$(DB_PASSWORD)@postgres.adagentflow.svc.cluster.local:5432/adagentflow"
            - name: RABBITMQ_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: adagentflow-secrets
                  key: rabbitmq_password
            - name: RABBITMQ_URL
              value: "amqp://adagent:$(RABBITMQ_PASSWORD)@rabbitmq.adagentflow.svc.cluster.local:5672/adagentflow"
            - name: WORKER_TYPE
              value: "heavy"
            - name: WORKER_CONCURRENCY
              value: "2"
          resources:
            requests:
              cpu: 500m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 1Gi
          livenessProbe:
            exec:
              command: ["python", "-c", "import socket; s=socket.socket(); s.settimeout(2); s.connect(('rabbitmq', 5672)); s.close()"]
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            exec:
              command: ["python", "-c", "import socket; s=socket.socket(); s.settimeout(2); s.connect(('rabbitmq', 5672)); s.close()"]
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
