apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: adagentflow
  labels:
    app.kubernetes.io/name: api
    app.kubernetes.io/part-of: adagentflow
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: api
  ports:
    - name: http
      port: 8000
      targetPort: 8000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: adagentflow
  labels:
    app.kubernetes.io/name: api
    app.kubernetes.io/part-of: adagentflow
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: api
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: api
        app.kubernetes.io/part-of: adagentflow
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: "/metrics"
    spec:
      containers:
        - name: api
          image: adagentflow/api:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - configMapRef:
                name: adagentflow-config
          env:
            - name: ANTHROPIC_AUTH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: adagentflow-secrets
                  key: anthropic_auth_token
            - name: LANGFUSE_PUBLIC_KEY
              valueFrom:
                secretKeyRef:
                  name: adagentflow-secrets
                  key: langfuse_public_key
            - name: LANGFUSE_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: adagentflow-secrets
                  key: langfuse_secret_key
            - name: DATABASE_URL
              value: "postgresql://adagent:$(DB_PASSWORD)@postgres.adagentflow.svc.cluster.local:5432/adagentflow"
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: adagentflow-secrets
                  key: db_password
            - name: RABBITMQ_URL
              value: "amqp://adagent:$(RABBITMQ_PASSWORD)@rabbitmq.adagentflow.svc.cluster.local:5672/adagentflow"
            - name: RABBITMQ_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: adagentflow-secrets
                  key: rabbitmq_password
          command: ["uvicorn"]
          args:
            - "app.main:app"
            - "--host"
            - "0.0.0.0"
            - "--port"
            - "8000"
            - "--workers"
            - "2"
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3