apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: api
  namespace: adagentflow
  labels:
    app.kubernetes.io/name: api
    app.kubernetes.io/part-of: adagentflow
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: api
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 30
      policies:
        - type: Percent
          value: 100
          periodSeconds: 30
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Percent
          value: 50
          periodSeconds: 60
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: worker-light
  namespace: adagentflow
  labels:
    app.kubernetes.io/name: worker-light
    app.kubernetes.io/part-of: adagentflow
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: worker-light
  minReplicas: 3
  maxReplicas: 20
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    # TODO: Add RabbitMQ queue-depth scaling.
    # The CPU metric above is the only metric built into core HPA.
    # Two supported options:
    #   1) KEDA — install https://keda.sh and replace this HPA with a
    #      ScaledObject that scales on the RabbitMQ queue (e.g.
    #      `rabbitmqQueueLength` from the KEDA RabbitMQ scaler) AND on CPU.
    #      KEDA will manage the HPA on our behalf.
    #   2) Prometheus Adapter — expose `rabbitmq_queue_messages_ready{queue=~"ad_task\\..*"}`
    #      as a custom metric via the prometheus-adapter, then add a
    #      `type: Pods` / `type: Object` metric here that references it.
    # Both keep min/max replicas at 3/20 as required.
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 15
      policies:
        - type: Pods
          value: 4
          periodSeconds: 30
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Percent
          value: 50
          periodSeconds: 60
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: worker-heavy
  namespace: adagentflow
  labels:
    app.kubernetes.io/name: worker-heavy
    app.kubernetes.io/part-of: adagentflow
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: worker-heavy
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 60
      policies:
        - type: Pods
          value: 2
          periodSeconds: 60
    scaleDown:
      stabilizationWindowSeconds: 600
      policies:
        - type: Percent
          value: 25
          periodSeconds: 60