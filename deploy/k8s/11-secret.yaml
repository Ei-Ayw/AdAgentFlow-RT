apiVersion: v1
kind: Secret
metadata:
  name: adagentflow-secrets
  namespace: adagentflow
  labels:
    app.kubernetes.io/part-of: adagentflow
type: Opaque
stringData:
  # Replace all __REPLACE_ME__ values before applying.
  # Example:
  #   kubectl -n adagentflow create secret generic adagentflow-secrets \
  #     --from-literal=anthropic_auth_token='sk-ant-...' \
  #     --from-literal=db_password='...' \
  #     --from-literal=rabbitmq_password='...' \
  #     --from-literal=langfuse_public_key='pk-lf-...' \
  #     --from-literal=langfuse_secret_key='sk-lf-...' \
  #     --from-literal=postgres_password='...' \
  #     --dry-run=client -o yaml | kubectl apply -f -
  anthropic_auth_token: "__REPLACE_ME__"
  db_password: "__REPLACE_ME__"
  postgres_password: "__REPLACE_ME__"
  rabbitmq_password: "__REPLACE_ME__"
  langfuse_public_key: "__REPLACE_ME__"
  langfuse_secret_key: "__REPLACE_ME__"