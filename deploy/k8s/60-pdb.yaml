apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: api
  namespace: adagentflow
  labels:
    app.kubernetes.io/name: api
    app.kubernetes.io/part-of: adagentflow
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: api
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: worker-light
  namespace: adagentflow
  labels:
    app.kubernetes.io/name: worker-light
    app.kubernetes.io/part-of: adagentflow
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: worker-light
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: worker-heavy
  namespace: adagentflow
  labels:
    app.kubernetes.io/name: worker-heavy
    app.kubernetes.io/part-of: adagentflow
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: worker-heavy