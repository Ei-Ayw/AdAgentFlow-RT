apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: adagentflow
  namespace: adagentflow
  labels:
    app.kubernetes.io/part-of: adagentflow
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "16m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "120"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "120"
    # Rate limiting at the ingress layer (L2 hard degradation gatekeeper).
    # 100 rps per IP by default; tune for production.
    nginx.ingress.kubernetes.io/limit-rps: "100"
    nginx.ingress.kubernetes.io/limit-connections: "50"
spec:
  ingressClassName: nginx
  rules:
    - host: adagentflow.example.com
      http:
        paths:
          - path: /api/v1
            pathType: Prefix
            backend:
              service:
                name: api
                port:
                  number: 8000
          - path: /dashboard
            pathType: Prefix
            backend:
              service:
                name: api
                port:
                  number: 8000
          - path: /health
            pathType: Exact
            backend:
              service:
                name: api
                port:
                  number: 8000
          - path: /metrics
            pathType: Exact
            backend:
              service:
                name: api
                port:
                  number: 8000