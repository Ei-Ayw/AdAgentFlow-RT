name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m compileall -q app migrations
      - run: python scripts/secret_scan.py
      - run: pytest -q

  infrastructure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Start PostgreSQL, Redis and RabbitMQ
        run: docker compose -f docker-compose.integration.yml up -d --wait
      - name: Apply migrations
        env:
          DATABASE_URL: postgresql://adagent:adagent_it_password@localhost:15432/adagentflow
        run: alembic upgrade head
      - name: Run real infrastructure tests
        env:
          RUN_INFRA_TESTS: "1"
          DATABASE_URL: postgresql://adagent:adagent_it_password@localhost:15432/adagentflow
          REDIS_URL: redis://localhost:16379/0
          RABBITMQ_URL: amqp://adagent:adagent_it_password@localhost:25672/adagentflow
        run: pytest tests/test_infrastructure_integration.py -q
      - name: Run process-level SIGKILL recovery tests
        env:
          DATABASE_URL: postgresql://adagent:adagent_it_password@localhost:15432/adagentflow
          REDIS_URL: redis://localhost:16379/0
          RABBITMQ_URL: amqp://adagent:adagent_it_password@localhost:25672/adagentflow
          LOG_FORMAT: text
        run: python scripts/process_fault_injection.py
      - name: Show service logs on failure
        if: failure()
        run: docker compose -f docker-compose.integration.yml logs
      - name: Stop infrastructure
        if: always()
        run: docker compose -f docker-compose.integration.yml down -v
